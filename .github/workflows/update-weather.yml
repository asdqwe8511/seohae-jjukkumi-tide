name: 바다날씨 주간 갱신

on:
  schedule:
    # 매주 월요일 06:00 KST (일요일 21:00 UTC) — 한 주치 예보를 미리 받아둔다
    - cron: "0 21 * * 0"
  workflow_dispatch:        # 필요할 때 수동 실행

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 앞바다 예보 다시 받기
        run: bash tools/fetch-weather.sh index.html

      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- index.html; then
            echo "예보에 변화 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "바다날씨 갱신 ($(TZ=Asia/Seoul date +%F) KST)"
          git push
